<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1628"/>
      <stop offset="0.5" stop-color="#0F1E36"/>
      <stop offset="1" stop-color="#132540"/>
    </linearGradient>
  </defs>

  <!-- Nền navy đêm -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Vòng tròn xanh nhạt (giống hero web) -->
  <circle cx="48" cy="18" r="4" fill="none" stroke="#7DD3FC" stroke-width="1.2" opacity="0.85"/>

  <!-- Sao đêm rải rác -->
  <circle cx="12" cy="14" r="0.8" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="18" cy="52" r="0.6" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="54" cy="48" r="0.7" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="8" cy="34" r="0.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="42" cy="56" r="0.5" fill="#FFFFFF" opacity="0.4"/>

  <!-- Chữ p serif italic (match logo web) -->
  <text x="30" y="48" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="44" 
        font-style="italic" 
        font-weight="400"
        fill="#F1F5F9" 
        text-anchor="middle">p</text>
</svg>